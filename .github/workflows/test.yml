name: build-and-test
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libmariadb-dev libcurl4-openssl-dev libjansson-dev
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Test with mock API
        run: ctest --test-dir build --output-on-failure
      - name: Test inside MariaDB
        run: python3 tests/sql_integration.py
